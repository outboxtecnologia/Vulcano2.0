server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # A SPA fala com a API pela MESMA ORIGEM (API_BASE vazio) e o nginx encaminha.
    #
    # Antes o bundle era compilado com VITE_API_BASE=http://<ip-interno>:8000 e o
    # navegador chamava aquele host direto. Funcionava por HTTP, mas pelo dominio
    # HTTPS o Chrome bloqueia mixed content (pagina https -> fetch http) antes da
    # requisicao sair — o DevTools mostra isso como "erro de CORS", embora o backend
    # ja libere origem com allow_origins=["*"].
    #
    # Precisa vir ANTES do location / , senao o try_files devolveria o index.html
    # para /api/... (era o motivo de GET /api/... responder 200 com HTML e do POST
    # levar 405 do proprio nginx).
    location /api/ {
        # Upstream via variavel + resolver do Docker (127.0.0.11) de proposito: com
        # `proxy_pass http://backend:8000` o nginx resolve o nome UMA vez, ao iniciar,
        # e aborta com "host not found in upstream" se o backend ainda nao estiver no
        # DNS da rede — o frontend nem sobe. Resolvendo em runtime ele tolera a ordem
        # de subida e reaprende o IP se o container do backend for recriado.
        #
        # Com variavel no proxy_pass o nginx NAO reanexa o URI: por isso o
        # $request_uri explicito (preserva /api/... e a query string).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de matricula (PDF) e importacao em lote passam por aqui.
        client_max_body_size 64m;
        # A extracao via Vertex faz 3 leituras do documento e estoura o default de 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
