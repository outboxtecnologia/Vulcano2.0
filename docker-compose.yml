# Vulcano2 / Questor Explorer — backend (FastAPI) + frontend (Nginx estático).
#
# Firebird fica FORA do Docker: em backend/.env defina FIREBIRD_HOST e DB_PATH_* como no servidor remoto.
#
# Uso:
#   cp backend/.env.example backend/.env   # edite
#   docker compose build
#   docker compose up -d
#
# Frontend fala com a API na URL usada pelo navegador. Para máquina local com portas publicadas:
#   VITE_API_BASE=http://localhost:8000 docker compose build frontend
#
# Persistência SQLite POC (crie o arquivo vazio se não existir:  touch backend/poc_database.sqlite)
#
# Vertex AI: no env_file use só o nome, ex.: GOOGLE_APPLICATION_CREDENTIALS=chave_fernando.json
# Monte o arquivo do host para /app/ (WORKDIR do backend):
#   - ./backend/chave_fernando.json:/app/chave_fernando.json:ro
# Alternativa: GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-sa.json + volume em ./secrets/

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      POC_DATABASE_FILE: /data/poc_database.sqlite
      BOOTSTRAP_ON_START: "1"
      BOOTSTRAP_TARGET: "all"
      BOOTSTRAP_STRICT: "0"
    volumes:
      - poc_sqlite:/data
      # Vertex JSON (mesmo nome que no .env, ex. chave_fernando.json):
      # - ./backend/chave_fernando.json:/app/chave_fernando.json:ro
      # - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    extra_hosts:
      # Acessar serviços no host Linux a partir do container (ex.: Firebird exposto só no host)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  poc_sqlite:
