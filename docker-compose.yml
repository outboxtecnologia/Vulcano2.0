# Vulcano2 / Questor Explorer — backend (FastAPI) + frontend (Nginx estático).
#
# Firebird fica FORA do Docker: em backend/.env defina FIREBIRD_HOST e DB_PATH_* como no servidor remoto.
#
# Uso:
#   cp backend/.env.example backend/.env   # edite
#   docker compose build
#   docker compose up -d
#
# Frontend fala com a API na URL usada pelo navegador. Para máquina local com portas publicadas:
#   VITE_API_BASE=http://localhost:8000 docker compose build frontend
#
# Persistência SQLite POC (crie o arquivo vazio se não existir:  touch backend/poc_database.sqlite)
#
# Vertex AI: copie o JSON para backend/chave_fernando.json antes do `docker compose up`
# (sem esse arquivo o bind mount abaixo falha no compose).
# Override opcional: defina GOOGLE_APPLICATION_CREDENTIALS em backend/.env.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POC_DATABASE_FILE: /data/poc_database.sqlite
      BOOTSTRAP_ON_START: "1"
      # Dokploy: use sqlite até FIREBIRD_* reais no Environment; depois mude para "all"
      BOOTSTRAP_TARGET: "sqlite"
      BOOTSTRAP_STRICT: "0"
      GOOGLE_APPLICATION_CREDENTIALS: chave_fernando.json
    volumes:
      - poc_sqlite:/data
      # Dokploy: Mounts → ../files/chave_fernando.json → /app/chave_fernando.json
    extra_hosts:
      # Acessar serviços no host Linux a partir do container (ex.: Firebird exposto só no host)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  poc_sqlite:
