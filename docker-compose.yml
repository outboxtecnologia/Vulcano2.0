# Vulcano2 / Questor Explorer — backend (FastAPI) + frontend (Nginx estático).
#
# Firebird fica FORA do Docker: em backend/.env defina FIREBIRD_HOST e DB_PATH_* como no servidor remoto.
#
# Uso:
#   cp backend/.env.example backend/.env   # edite
#   docker compose build
#   docker compose up -d
#
# Frontend serve a SPA e faz proxy de /api para o backend (ver frontend/nginx.conf),
# entao VITE_API_BASE fica VAZIO e o navegador chama a mesma origem. Nao aponte para
# um host http:// quando o acesso for por dominio https — o navegador bloqueia.
#
# Persistência SQLite POC (crie o arquivo vazio se não existir:  touch backend/poc_database.sqlite)
#
# Vertex AI: copie o JSON para backend/chave_fernando.json antes do `docker compose up`
# (sem esse arquivo o bind mount abaixo falha no compose).
# Override opcional: defina GOOGLE_APPLICATION_CREDENTIALS em backend/.env.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POC_DATABASE_FILE: /data/poc_database.sqlite
      BOOTSTRAP_ON_START: ${BOOTSTRAP_ON_START:-1}
      BOOTSTRAP_TARGET: ${BOOTSTRAP_TARGET:-sqlite}
      BOOTSTRAP_STRICT: ${BOOTSTRAP_STRICT:-0}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-chave_fernando.json}
      # Banco operacional do app — opt-in: mude para postgres apos rodar
      # `python bootstrap_schema.py --target app-pg` e (se quiser) a migracao.
      APP_DB_KIND: ${APP_DB_KIND:-sqlite}
      APP_PG_HOST: ${APP_PG_HOST:-postgres}
      APP_PG_PORT: ${APP_PG_PORT:-5432}
      APP_PG_DB: ${APP_PG_DB:-vulcano2}
      APP_PG_USER: ${APP_PG_USER:-vulcano}
      APP_PG_PASS: ${APP_PG_PASS:-troque_esta_senha}
    volumes:
      - poc_sqlite:/data
      # Credencial Vertex. No Dokploy o conteudo vem de Advanced → Mounts (File Mount
      # `chave_fernando.json`), que grava em <compose>/files/ — dai o `../files`, ja que
      # o compose roda a partir de <compose>/code. File Mount em servico Compose nao
      # monta sozinho: sem esta linha o arquivo fica no host e o container nao ve nada.
      # Local: sem o arquivo, o Docker cria um diretorio vazio aqui e o backend sobe sem IA.
      - ../files/chave_fernando.json:/app/chave_fernando.json:ro
    extra_hosts:
      # Acessar serviços no host Linux a partir do container (ex.: Firebird exposto só no host)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    # PG PROPRIO do Vulcano 2.0 (banco operacional do app: baixas, projetadas,
    # usuarios, parsers...). Ligue no backend com APP_DB_KIND=postgres.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${APP_PG_DB:-vulcano2}
      POSTGRES_USER: ${APP_PG_USER:-vulcano}
      POSTGRES_PASSWORD: ${APP_PG_PASS:-troque_esta_senha}
    volumes:
      - app_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vazio de proposito: a SPA chama a MESMA ORIGEM e o nginx do frontend
        # encaminha /api para o backend. Apontar isto para um host http:// quebra
        # o acesso pelo dominio https (mixed content). So preencha se o frontend
        # for servido de uma origem diferente da API, e ai use https.
        VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  poc_sqlite:
  app_pg_data:

networks:
  default:
    ipam:
      config:
        # Subnet fixa de proposito. Quando o pool padrao do Docker (172.17-172.31) se
        # esgota, ele sorteia a bridge em faixas 192.168.x, que podem colidir com a LAN
        # onde estao os servidores Firebird/Postgres. Nesse caso o container passa a
        # trata-los como vizinhos locais e toda conexao falha com "No route to host".
        # Ajuste este valor se 172.16.240.0/24 ja estiver em uso no seu host.
        - subnet: 172.16.240.0/24
